global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'ecommerce-hub-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
  - job_name: 'ecommerce-hub-worker'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9091']
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']