spring:
  application:
    name: ecommerce-hub-worker

  # reusável como está — o valor real vem sobrescrito em runtime pelo
  # @DynamicPropertySource do teste (mysql::getJdbcUrl etc), o Testcontainer
  # decide a porta/schema de verdade. Isso aqui só evita erro de propriedade
  # ausente caso algo suba antes do @DynamicPropertySource rodar.
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_hub_test
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: validate   # reusável — mesma regra da produção: schema só muda via Flyway
    open-in-view: false

  # MUDANÇA PRA TESTE: produção não tem esse bloco no Worker (a API migra
  # primeiro). Aqui é obrigatório, senão o Hibernate falha em validate
  # porque o Testcontainer nasce com banco vazio.
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost      # reusável — não é usado de fato: RedisTemplate é
    port: 5672            # mockado e handle() é chamado direto, sem @RabbitListener
    username: guest       # real subindo container. Ver nota abaixo sobre isso.
    password: guest

  data:
    redis:
      host: localhost     # inerte — RedisTemplate é @MockitoBean no teste
      port: 6379
      repositories:
        enabled: false

resilience4j:
  circuitbreaker:
    instances:
      marketplaceSync:                     # reusável como está — mesmos parâmetros da produção
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-closed-enabled: true

# MUDANÇA PRA TESTE: produção lê de ${DISCORD_WEBHOOK_URL} via .env, que
# não é carregado em contexto de teste (spring-dotenv só age fora de teste)
# — sem isso, sobe PlaceholderResolutionException.
discord:
  webhook-url: "https://discord.com/api/webhooks/fake/for-tests"

# inerte para este teste específico — sobrescrito por @DynamicPropertySource
# com a porta dinâmica do WireMockServer, mas precisa de um valor default
# válido pro contexto não quebrar antes do dynamic property rodar.
marketplace:
  base-url: http://localhost:8082

management:
  server:
    port: 0    # MUDANÇA PRA TESTE: porta 0 = aleatória, evita conflito de
      # porta se você rodar testes em paralelo ou já tiver o
    # Worker real rodando na 9091 via IntelliJ
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics

server:
  port: 0      # mesma lógica acima

logging:
  level:
    com.raul.ecommercehub: INFO